    <title>NetScale Flow Pro</title>
    <script>
      // Applied before first paint to avoid a light-theme flash on load.
      (function () {
        try {
          var stored = localStorage.getItem('netscale_theme');
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
